<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>SMART-THI — Live Unit Dashboard</title>
<meta name="description" content="Live five-index health monitoring and protection dashboard, connected directly to a single SMART-THI unit." />
<meta name="theme-color" content="#F3F6F5" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icons/icon-32.png" sizes="32x32" type="image/png" />
<link rel="icon" href="./icons/icon-16.png" sizes="16x16" type="image/png" />
<link rel="apple-touch-icon" href="./icons/icon-180.png" />
<link rel="stylesheet" href="./bundle.css" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="SMART-THI Live" />
<script>
  // Apply theme before paint to avoid a flash of the wrong mode.
  // Defaults to light regardless of OS/browser preference — only an
  // explicit in-app toggle (saved to localStorage) switches to dark.
  try {
    var t = localStorage.getItem("smart-thi-theme") || "light";
    document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
</script>
<style>
  html, body { margin: 0; padding: 0; background: #F3F6F5; }
  html[data-theme="dark"], html[data-theme="dark"] body { background: #0B1417; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="./bundle.js"></script>
</body>
</html>
